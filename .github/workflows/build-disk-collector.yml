name: Build Disk Collector Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to label the Docker image under (no "v" prefix, e.g. "1.2.3")'
        required: true
        type: string
      tag_latest:
        description: 'Also tag this image as :latest?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/publish-image.yml
    with:
      image: project-nomad-wsl-disk-collector
      context: install/sidecar-disk-collector
      version: ${{ inputs.version }}
      tag_latest: ${{ inputs.tag_latest }}
