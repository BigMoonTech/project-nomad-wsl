name: Build Primary Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to label the Docker image under (no "v" prefix, e.g. "1.2.3")'
        required: true
        type: string
      tag_latest:
        description: 'Also tag this image as :latest? (Keep false for RC and beta releases)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    needs: verify-runtime-public
    uses: ./.github/workflows/publish-image.yml
    with:
      image: project-nomad-wsl
      context: .
      version: ${{ inputs.version }}
      tag_latest: ${{ inputs.tag_latest }}
    secrets:
      CREATOR_PACKS_APP_KEY: ${{ secrets.CREATOR_PACKS_APP_KEY }}

  translate:
    uses: ./.github/workflows/publish-image.yml
    with:
      image: project-nomad-wsl-translate
      context: install/nomad-translate
      version: ${{ inputs.version }}
      tag_latest: ${{ inputs.tag_latest }}

  ollama:
    uses: ./.github/workflows/publish-image.yml
    with:
      image: project-nomad-wsl-ollama
      context: install/nomad-ollama
      version: ${{ inputs.version }}
      tag_latest: ${{ inputs.tag_latest }}
      cache: true

  verify-runtime-public:
    needs: [ollama, translate]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      # A new Command Center release selects matching runtime tags on fresh
      # installs. Verify those dependencies anonymously before moving its tags.
      - name: Verify runtime images are public on both architectures
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for component in ollama translate; do
            docker buildx imagetools inspect "ghcr.io/bigmoontech/project-nomad-wsl-$component:$VERSION" --raw | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] | unique == ["amd64", "arm64"]'
          done
