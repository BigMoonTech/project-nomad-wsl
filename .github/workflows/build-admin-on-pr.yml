name: Build Admin

on: pull_request

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Check installer platform detection
        run: bash .github/scripts/test-installer.sh
      - name: Build and check native images
        run: |
          docker build --build-arg VERSION=ci -t nomad-admin:ci .
          docker run --rm --entrypoint node nomad-admin:ci -e \
            "require('@openzim/libzim'); require('sharp'); require('node:assert/strict').equal(require('./version.json').version, 'ci')"
          docker run --rm --network none --memory=512m --entrypoint node nomad-admin:ci --test \
            tests/unit/regional_map_lfs.spec.js \
            tests/unit/map_assets_archive.spec.js \
            tests/unit/http_dependencies.spec.js \
            tests/unit/compression_middleware.spec.js \
            tests/unit/model_popularity.spec.js \
            tests/unit/ollama_runtime.spec.js \
            tests/unit/ollama_compute.spec.js
          docker run --rm --entrypoint pmtiles nomad-admin:ci version
          docker build -t nomad-updater:ci install/sidecar-updater
          docker run --rm --entrypoint docker nomad-updater:ci compose version
          docker build -t nomad-collector:ci install/sidecar-disk-collector
          docker run --rm --entrypoint lsblk nomad-collector:ci --version
      - name: Fetch the previous WSL release fixture
        if: runner.arch == 'X64'
        run: git fetch --depth=1 origin tag v1.32.101
      - name: Boot Command Center and verify migrations
        run: bash .github/scripts/smoke-compose.sh
      - name: Check native offline translation
        run: |
          docker build -t nomad-translate:ci install/nomad-translate
          docker volume create translate-models
          docker run --rm -v translate-models:/models -e TRANSLATE_LANGS=es --entrypoint python nomad-translate:ci fetch_models.py
          docker run --rm --network none -v translate-models:/models:ro --entrypoint python nomad-translate:ci -c '
          import proxy
          result = proxy.translate_blocks("enes", ["Hello, how are you?", "This is a <b>house</b>."])
          assert "hola" in result[0].lower() and "<b>" in result[1] and "casa" in result[1], result'

  ollama:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: install/nomad-ollama
          load: true
          tags: nomad-ollama:ci
          # Read only the public cache produced by a trusted main-branch release.
          # The full CUDA build exceeds the Actions cache budget; PRs never write
          # to the release cache or need package-publishing credentials.
          cache-from: ${{ matrix.arch == 'arm64' && 'type=registry,ref=ghcr.io/bigmoontech/project-nomad-wsl-ollama:buildcache-arm64' || '' }}
      - name: Verify engine, preserved GGUF libraries and CPU startup
        run: bash .github/scripts/test-ollama-image.sh nomad-ollama:ci
